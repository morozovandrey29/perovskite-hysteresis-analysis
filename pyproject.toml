[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perovskite-hysteresis-analysis"
version = "0.1.0"
description = "Phenomenological multi-relaxation fitting of frequency-dependent hysteresis-area spectra"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26", "scipy>=1.12", "matplotlib>=3.8"]

[project.scripts]
hysteresis-analysis = "hysteresis_analysis.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hysteresis_analysis = ["config.example.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
